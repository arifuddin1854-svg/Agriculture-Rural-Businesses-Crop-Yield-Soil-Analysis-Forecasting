name: Axlero Platform CI/CD Pipeline

on:
  push:
    branches: [ "main", "Syed-Abdus-Sabur" ]
  pull_request:
    branches: [ "main", "Syed-Abdus-Sabur" ]

env:
  MPLBACKEND: Agg

jobs:
  lint-and-syntax:
    name: Code Syntax & Static Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Python Bytecode Compilation Check
        run: |
          python -m compileall src/ tests/ *.py

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,scratch,.venv

  unit-and-integration-tests:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Discovery
        run: |
          python -m unittest discover tests -v

  platform-health-audit:
    name: Model & Data Health Audit
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Health Audit CLI
        run: |
          python run_system_health_audit.py --strict

      - name: Upload Audit Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-health-audit-reports
          path: reports/system_health_audit.*

  docker-build-verification:
    name: Container Build & Healthcheck
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: axlero/crop-yield-platform:test
