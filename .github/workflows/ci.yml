name: Agriculture Project CI

on:
  push:
    branches:
      - main
      - feature/engineer-5-week2-devops
  pull_request:
    branches:
      - main

jobs:
  quality-and-tests:
    name: Code Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black==25.1.0 flake8==7.1.2

      - name: Check formatting
        run: black --check tests/test_api.py tests/test_features.py

      - name: Check code quality
        run: flake8 tests/test_api.py tests/test_features.py

      - name: Run automated tests
        run: python -m pytest -v

      - name: Start database and API containers
        run: docker compose up -d --build db api

      - name: Wait for containers to become healthy
        run: |
          for i in {1..30}; do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' agriculture-api 2>/dev/null)" = "healthy" ] && \
               [ "$(docker inspect --format='{{.State.Health.Status}}' agriculture-postgres 2>/dev/null)" = "healthy" ]; then
              echo "Both containers are healthy."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Containers failed to become healthy."
              docker compose ps
              docker compose logs
              exit 1
            fi
            sleep 10
          done

      - name: Run API smoke test
        run: |
          python -c "import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=10)); print(data); assert data['status'] == 'healthy'; assert data['database']['status'] == 'connected'"

      - name: Stop containers
        if: always()
        run: docker compose down -v
