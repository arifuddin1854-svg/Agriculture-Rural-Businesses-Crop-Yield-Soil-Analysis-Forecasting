
services:
  # Existing Week 1 development container
  agriculture-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriculture-rural-business-dev
    working_dir: /app
    volumes:
      - .:/app
    stdin_open: true
    tty: true

  # PostgreSQL database
  db:
    image: postgres:16
    container_name: agriculture-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agri_yield_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # FastAPI application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriculture-api
    restart: unless-stopped
    working_dir: /app
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    environment:
      ENVIRONMENT: development
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agri_yield_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
