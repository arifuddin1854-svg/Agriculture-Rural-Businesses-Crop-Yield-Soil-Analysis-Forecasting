version: '3.8'

services:
  crop-yield-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: axlero/crop-yield-platform:1.0.0
    container_name: axlero-crop-yield-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - axlero-network

networks:
  axlero-network:
    driver: bridge
